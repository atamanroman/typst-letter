[package]
name = "typst-letter"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Self-hosted web service for writing letters in Typst"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Typst — versions must agree on the underlying compiler (0.15)
typst = "0.15"
typst-pdf = "0.15"
typst-as-lib = { version = "0.16", features = [
  "typst-kit-fonts",
  "typst-kit-embed-fonts",
  "packages",
  "ureq",
] }
ecow = "0.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
